<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>همسة للسياحة – البث المباشر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#14264f;--mut:#5b6b8c;--blue:#24408e;--gold:#f9c613;--bd:#dbe3f2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1430;--card:#122049;--tx:#eef2ff;--mut:#9fb0d8;--bd:#25376e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:4px solid var(--gold)}
header img{height:64px}header h1{margin:0;font-size:1.2rem;color:#24408e}
.live{margin-inline-start:auto;background:#e11d48;color:#fff;font-weight:900;padding:4px 14px;border-radius:99px;font-size:.9rem;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.5}}
main{max-width:1000px;margin:18px auto;padding:0 14px}
.stage{position:relative;aspect-ratio:16/9;background:#050a1c;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0004}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0d8;text-align:center;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:16px}
.card h2{margin:0 0 10px;font-size:1.05rem}
.w{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--bd)}
.w b{font-size:1.05rem}.tag{padding:2px 12px;border-radius:99px;font-weight:700;font-size:.85rem;color:#14264f;background:var(--gold)}
.tag.t1{background:#8fb4ff}.tag.t3{background:#ffd27a}
.hint{color:var(--mut);font-size:.9rem;margin:0}
#ov{position:absolute;inset:0;z-index:5;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#1a2f7acc,#050a1cf2);cursor:pointer;overflow:hidden}
#ov.on{display:grid;animation:fi .5s}
@keyframes fi{from{opacity:0}}
.rays{position:absolute;width:260%;aspect-ratio:1;background:repeating-conic-gradient(#f9c61333 0 8deg,transparent 8deg 24deg);animation:sp 24s linear infinite;border-radius:50%}
@keyframes sp{to{transform:rotate(360deg)}}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.box{position:relative;color:#fff;padding:10px 16px;animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.1) rotate(-8deg);opacity:0}}
.box img{height:clamp(40px,12vw,90px);background:#fff;border-radius:14px;padding:4px 10px;margin-bottom:6px}
.cong{font-family:'Reem Kufi',Cairo,sans-serif;font-size:clamp(1rem,3.4vw,1.8rem);color:#ffe27a;letter-spacing:1px}
.nm{font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:clamp(2rem,9vw,5rem);line-height:1.2;margin:4px 0;background:linear-gradient(90deg,#f9c613,#fff6c2,#f9c613,#fff6c2);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.5s linear infinite;filter:drop-shadow(0 0 14px #f9c613aa)}
@keyframes sh{to{background-position:-300% 0}}
.pz{display:inline-block;margin-top:6px;padding:6px 26px;border-radius:99px;font-weight:900;font-size:clamp(1rem,3.8vw,2rem);color:#14264f;background:linear-gradient(135deg,#f9c613,#ffe98a);box-shadow:0 0 28px #f9c613aa;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}
</style>
</head>
<body>
<header><img src="logo.png" alt="همسة للسياحة"><h1>سحب العمرة – بث مباشر</h1><span class="live">● مباشر</span></header>
<main>
<div class="stage" id="stage">
<div class="empty" id="empty">البث المباشر هيظهر هنا قريبًا</div>
<div id="ov"><div class="rays"></div><canvas id="cv"></canvas>
<div class="box"><img src="logo.png" alt=""><div class="cong">🎉 مبروك الفوز 🎉</div><div class="nm" id="onm"></div><div class="pz" id="opz"></div></div></div>
</div>
<div class="card"><h2>🏆 الفائزون</h2><div id="list"><p class="hint">لا يوجد فائزون بعد.</p></div></div>
</main>
<script src="config.js"></script>
<script>
const PR={"عمرة تيسير":"t1","عمرة مجانية":"","عمرة نص مجانية":"t3"};
const $=i=>document.getElementById(i);
let seen=null,q=[],showing=false,curStream=null,raf;

function embed(u){
 try{const x=new URL(u);const h=x.hostname.replace('www.','');let id=null;
 if(h==='youtu.be')id=x.pathname.slice(1);
 else if(h.endsWith('youtube.com'))id=x.searchParams.get('v')||(x.pathname.match(/\/(live|embed|shorts)\/([^/?]+)/)||[])[2];
 if(id)return 'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&rel=0';
 if(h.endsWith('facebook.com')||h==='fb.watch')return 'https://www.facebook.com/plugins/video.php?show_text=false&autoplay=true&href='+encodeURIComponent(u);
 }catch(e){}return u}
function setStream(u){
 if(u===curStream)return;curStream=u;
 const old=$('stage').querySelector('iframe');if(old)old.remove();
 if(!u){$('empty').style.display='grid';return}
 $('empty').style.display='none';
 const f=document.createElement('iframe');f.src=embed(u);f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;
 $('stage').insertBefore(f,$('ov'));
}
function render(ws){
 const l=$('list');l.textContent='';
 if(!ws.length){l.innerHTML='<p class="hint">لا يوجد فائزون بعد.</p>';return}
 ws.forEach(v=>{const r=document.createElement('div');r.className='w';
  const n=document.createElement('b');n.textContent=v.name;
  const t=document.createElement('span');t.className='tag '+(PR[v.prize]||'');t.textContent=v.prize;
  r.append('🏅 ',n,t);l.append(r)});
}
function confetti(){
 const c=$('cv'),g=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;
 const cols=['#f9c613','#ffffff','#3d6ad6','#ffe98a','#ff5d8f'];
 const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,s:5+Math.random()*8,v:2+Math.random()*4,r:Math.random()*6,w:Math.random()*.2-.1,c:cols[Math.random()*5|0]}));
 cancelAnimationFrame(raf);
 (function f(){g.clearRect(0,0,c.width,c.height);
  P.forEach(p=>{p.y+=p.v;p.r+=p.w;p.x+=Math.sin(p.r)*1.5;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}
   g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});
  raf=requestAnimationFrame(f)})();
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.15,a.currentTime+i*.14);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.14+.4);o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.14);o.stop(a.currentTime+i*.14+.45)})}catch(e){}}
function next(){
 if(showing||!q.length)return;showing=true;const w=q.shift();
 $('onm').textContent=w.name;$('opz').textContent=w.prize;
 $('ov').classList.remove('on');void $('ov').offsetWidth;$('ov').classList.add('on');
 confetti();beep();
 let tm;const done=()=>{if(!showing)return;$('ov').classList.remove('on');cancelAnimationFrame(raf);showing=false;clearTimeout(tm);setTimeout(next,400)};
 tm=setTimeout(done,12000);$('ov').onclick=done;
}
async function poll(){
 try{
  const r=await fetch(API_URL+'?t='+Date.now());const s=await r.json();
  setStream(s.stream||'');render(s.winners||[]);
  const ids=new Set((s.winners||[]).map(w=>w.id));
  if(seen===null)seen=ids;
  else{(s.winners||[]).slice().reverse().forEach(w=>{if(!seen.has(w.id)){seen.add(w.id);q.push(w)}});next()}
 }catch(e){}
}
poll();setInterval(poll,3000);
</script>
</body>
</html>
