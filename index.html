<div id="hl-root" dir="rtl">
<video class="bgv" autoplay muted loop playsinline preload="auto" poster="https://hamsatouirsmcompany.github.io/-/bg.jpg" aria-hidden="true"><source src="https://hamsatouirsmcompany.github.io/-/bg.mp4" type="video/mp4"></video><div class="shade"></div>
<style>
#hl-root{--gold:#f9c613;--gold2:#ffe98a;--navy:#0b1a45;--navy2:#142c6b;position:relative;overflow:hidden;width:100%;margin:0;padding:34px 0 40px;font-family:Cairo,Tahoma,sans-serif;color:#fff;background:#0b1a45;border-top:5px solid var(--gold);border-bottom:5px solid var(--gold)}
#hl-root .bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;z-index:0;transform:scale(1.04);animation:hlkb 40s ease-in-out infinite alternate}
@keyframes hlkb{to{transform:scale(1.14) translateY(-1.5%)}}
#hl-root .shade{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 80% at 50% 30%,#0b1a4544,#0b1a45bb 75%),linear-gradient(180deg,#0b1a45aa,#0b1a4566 35%,#0b1a45e6)}
#hl-root .in{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:0 20px}
@media (prefers-reduced-motion:reduce){#hl-root .bgv{animation:none}}
#hl-root *{box-sizing:border-box}
#hl-root .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
#hl-root .lg{background:#fff;border-radius:16px;padding:6px 14px;display:flex;box-shadow:0 4px 14px #0004}
#hl-root .lg img{height:54px;display:block}
#hl-root .tt h2{margin:0;font-size:clamp(1.1rem,3.2vw,1.7rem);font-weight:900;color:#fff}
#hl-root .tt p{margin:2px 0 0;font-size:.9rem;color:#b9c8f0}
#hl-root .live{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff33;padding:6px 16px;border-radius:99px;font-weight:900;font-size:.9rem;letter-spacing:1px}
#hl-root .live i{width:10px;height:10px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 0 0 #ff3b5c;animation:hlpulse 1.6s infinite}
@keyframes hlpulse{70%{box-shadow:0 0 0 10px #ff3b5c00}100%{box-shadow:0 0 0 0 #ff3b5c00}}
#hl-root .frame{padding:3px;border-radius:20px;background:linear-gradient(135deg,var(--gold),#fff3b0 30%,#b88a00 60%,var(--gold));box-shadow:0 12px 40px #0008}
#hl-root .st{position:relative;aspect-ratio:16/9;background:#050a1c;border-radius:17px;overflow:hidden}
#hl-root .st iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hl-root .em{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:#9fb0d8;text-align:center;padding:20px;font-size:1.05rem}
#hl-root .em b{font-size:2.6rem}
#hl-root .tick{margin-top:14px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#f9c61322,#ffffff0d);border:1px solid #f9c61355;border-radius:14px;padding:11px 16px;font-weight:700}
#hl-root .tick::before{content:"🏆";font-size:1.3rem}
#hl-root .cd{background:#ffffff0f;border:1px solid #ffffff22;border-radius:18px;padding:16px;margin-top:16px;backdrop-filter:blur(6px)}
#hl-root h3{margin:0 0 12px;font-size:1.1rem;font-weight:900;color:var(--gold2)}
#hl-root input,#hl-root select{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid #ffffff33;background:#0a163d;color:#fff;outline:0}
#hl-root input:focus,#hl-root select:focus{border-color:var(--gold)}
#hl-root input::placeholder{color:#8ea0cf}
#hl-root button{font:inherit;cursor:pointer;padding:11px 18px;border-radius:12px;border:0;background:#2e55c4;color:#fff;font-weight:900;transition:.15s}
#hl-root button:hover{filter:brightness(1.12);transform:translateY(-1px)}
#hl-root button.g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#14264f}
#hl-root button.x{background:#e11d48;padding:6px 12px;font-size:.85rem}
#hl-root .rw{display:flex;gap:10px;flex-wrap:wrap}#hl-root .rw>input{flex:1;min-width:160px}
#hl-root .w{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff14;margin-bottom:8px}
#hl-root .w .no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#14264f;font-weight:900;flex:none}
#hl-root .w b{font-size:1.1rem;flex:1}
#hl-root .tag{padding:4px 14px;border-radius:99px;font-weight:900;font-size:.85rem;color:#14264f;background:var(--gold);white-space:nowrap}
#hl-root .tag.t1{background:#9ec0ff}#hl-root .tag.t3{background:#ffd98a}
#hl-root .hint{color:#b9c8f0;font-size:.95rem;margin:0}
#hl-root #hl-ov{position:absolute;inset:0;z-index:5;display:none;place-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,#1d3f94ee,#050c26f7 70%);cursor:pointer;overflow:hidden}
#hl-root #hl-ov.on{display:grid;animation:hlfi .6s}
@keyframes hlfi{from{opacity:0}}
#hl-root .rays{position:absolute;width:260%;aspect-ratio:1;background:repeating-conic-gradient(#f9c6130f 0 6deg,transparent 6deg 18deg);animation:hlsp 40s linear infinite;border-radius:50%}
@keyframes hlsp{to{transform:rotate(360deg)}}
#hl-root #hl-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hl-root .box{position:relative;padding:14px 22px;animation:hlpop 1s cubic-bezier(.2,1.5,.4,1)}
@keyframes hlpop{from{transform:scale(.3) translateY(30px);opacity:0}}
#hl-root .box img{height:clamp(36px,10vw,74px);background:#fff;border-radius:14px;padding:4px 12px;box-shadow:0 0 30px #f9c61366}
#hl-root .ln{display:flex;align-items:center;gap:12px;justify-content:center;margin:12px auto 2px;max-width:420px}
#hl-root .ln:before,#hl-root .ln:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
#hl-root .ln:after{transform:scaleX(-1)}
#hl-root .cong{font-family:'Reem Kufi',Cairo,sans-serif;font-size:clamp(1.1rem,4vw,2.1rem);color:var(--gold2);letter-spacing:2px;white-space:nowrap}
#hl-root .nm{font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:clamp(2.2rem,10vw,5.4rem);line-height:1.25;margin:6px 0 10px;background:linear-gradient(100deg,#fff 20%,var(--gold) 40%,#fff 60%,var(--gold) 80%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hlsh 3s linear infinite;filter:drop-shadow(0 4px 18px #f9c61388)}
@keyframes hlsh{to{background-position:-300% 0}}
#hl-root .pz{display:inline-block;padding:8px 30px;border-radius:99px;font-weight:900;font-size:clamp(1rem,3.6vw,1.9rem);color:#14264f;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 0 4px #f9c61333,0 10px 30px #f9c61355;animation:hlpl 1.8s ease-in-out infinite}
@keyframes hlpl{50%{transform:scale(1.05)}}
#hl-root .dua{text-align:center;margin:2px 0 16px;font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:clamp(1.3rem,4.6vw,2.4rem);color:var(--gold2);text-shadow:0 2px 18px #f9c61366,0 2px 6px #000a;display:flex;align-items:center;justify-content:center;gap:14px}
#hl-root .dua:before,#hl-root .dua:after{content:"";height:2px;width:clamp(30px,10vw,120px);background:linear-gradient(90deg,transparent,var(--gold))}
#hl-root .dua:after{transform:scaleX(-1)}
#hl-root .dua span{animation:hldua 4s ease-in-out infinite}
@keyframes hldua{50%{opacity:.75;transform:scale(1.03)}}
@media(max-width:560px){#hl-root{padding:20px 0 26px}#hl-root .in{padding:0 12px}#hl-root .live{margin-inline-start:0}}
</style>

<script>
(function(){
const API="https://script.google.com/macros/s/AKfycbySiSBI_xSOSVwBG1ZhY7FCXGeRFDsVa473c5x7yYR2grj3eiomZR-unXahVv0gZeeCNQ/exec"; // رابط الـ /exec
const PR={"عمرة تيسير":"t1","عمرة مجانية":"","عمرة نص مجانية":"t3"};
const $=i=>document.getElementById('hl-'+i);
$('ologo').src=document.querySelector('#hl-root .lg img').src;
let seen=null,q=[],showing=false,cur=null,raf,PW=sessionStorage.getItem('hlpw')||'',authed=false,last=[];

function embed(u){try{const x=new URL(u),h=x.hostname.replace('www.','');let id=null;
 if(h==='youtu.be')id=x.pathname.slice(1);
 else if(h.endsWith('youtube.com'))id=x.searchParams.get('v')||(x.pathname.match(/\/(live|embed|shorts)\/([^/?]+)/)||[])[2];
 if(id)return 'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&rel=0';
 if(h.endsWith('facebook.com')||h==='fb.watch')return 'https://www.facebook.com/plugins/video.php?show_text=false&autoplay=true&href='+encodeURIComponent(u);
 }catch(e){}return u}
function setStream(u){if(u===cur)return;cur=u;
 const o=$('st').querySelector('iframe');if(o)o.remove();
 if(!u){$('em').style.display='grid';return}
 $('em').style.display='none';
 const f=document.createElement('iframe');f.src=embed(u);f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;
 $('st').insertBefore(f,$('ov'));}
async function call(b){try{const r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({password:PW},b))});const t=await r.text();try{return JSON.parse(t)}catch(e){return {ok:false,error:'الرد مش JSON – غالبًا النشر مش Anyone أو محتاج نسخة جديدة: '+t.slice(0,80)}}}catch(e){return {ok:false,error:'تعذر الاتصال: '+e.message}}}
function msg(t,ok){$('msg').textContent=t;$('msg').style.color=ok?'#15803d':'#e11d48'}
function render(ws){last=ws;const l=$('list');l.textContent='';
 const lt=$('last');
 if(!ws.length){lt.textContent='في انتظار السحب…';l.innerHTML='<p class="hint">لا يوجد فائزون بعد، تابعونا في البث المباشر.</p>';return}
 lt.textContent='آخر فائز: '+ws[0].name+' — '+ws[0].prize;
 ws.forEach((v,i)=>{const r=document.createElement('div');r.className='w';
  const nu=document.createElement('span');nu.className='no';nu.textContent=ws.length-i;
  const n=document.createElement('b');n.textContent=v.name;
  const t=document.createElement('span');t.className='tag '+(PR[v.prize]||'');t.textContent='🕋 '+v.prize;
  r.append(nu,n,t);
  if(authed){const x=document.createElement('button');x.className='x';x.textContent='حذف';x.onclick=async()=>{await call({action:'deleteWinner',id:v.id});poll()};r.append(x)}
  l.append(r)});}
function confetti(){const c=$('cv'),g=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;
 const cols=['#f9c613','#fff3b0','#ffffff','#e0a800','#8fb4ff'];
 const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,s:5+Math.random()*8,v:2+Math.random()*4,r:Math.random()*6,w:Math.random()*.2-.1,c:cols[Math.random()*5|0]}));
 cancelAnimationFrame(raf);(function f(){g.clearRect(0,0,c.width,c.height);
  P.forEach(p=>{p.y+=p.v;p.r+=p.w;p.x+=Math.sin(p.r)*1.5;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}
   g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});
  raf=requestAnimationFrame(f)})();}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.15,a.currentTime+i*.14);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.14+.4);o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.14);o.stop(a.currentTime+i*.14+.45)})}catch(e){}}
function next(){if(showing||!q.length)return;showing=true;const w=q.shift();
 $('onm').textContent=w.name;$('opz').textContent=w.prize;
 $('ov').classList.remove('on');void $('ov').offsetWidth;$('ov').classList.add('on');confetti();beep();
 let tm;const done=()=>{if(!showing)return;$('ov').classList.remove('on');cancelAnimationFrame(raf);showing=false;clearTimeout(tm);setTimeout(next,400)};
 tm=setTimeout(done,12000);$('ov').onclick=done;}
async function poll(){try{
 const s=await (await fetch(API+'?t='+Date.now())).json();
 setStream(s.stream||'');render(s.winners||[]);
 if(authed&&document.activeElement!==$('au'))$('au').value=s.stream||'';
 const ids=new Set((s.winners||[]).map(w=>w.id));
 if(seen===null)seen=ids;
 else{(s.winners||[]).slice().reverse().forEach(w=>{if(!seen.has(w.id)){seen.add(w.id);q.push(w)}});next()}
}catch(e){console.error("poll failed",e)}}
