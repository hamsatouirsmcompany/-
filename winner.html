<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>الفائز – سحب العمرة الكبير | همسة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f9c613;--gold2:#ffe98a;--gold3:#b88a00;--navy:#0b1a45;--navy2:#142c6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:#fff;font-family:Cairo,Tahoma,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
#sl{position:absolute;inset:0;overflow:hidden;background:#0b1a45}
#sl i{position:absolute;inset:0;background-size:cover;background-position:50% 50%;opacity:0;will-change:transform,opacity;animation:sfade 30s linear infinite}
#sl i:nth-child(1){background-image:url(bg1.jpg);background-position:50% 58%;transform-origin:50% 62%;animation:sfade 30s linear infinite,zin 30s linear infinite}
#sl i:nth-child(2){background-image:url(bg2.jpg);transform-origin:42% 50%;animation:sfade 30s 10s linear infinite,zout 30s 10s linear infinite}
#sl i:nth-child(3){background-image:url(bg3.jpg);background-position:50% 40%;transform-origin:50% 45%;animation:sfade 30s 20s linear infinite,zin 30s 20s linear infinite}
@keyframes sfade{0%{opacity:0}5%{opacity:1}33.3%{opacity:1}38.3%{opacity:0}100%{opacity:0}}
@keyframes zin{0%{transform:scale(1.02)}38.3%{transform:scale(1.22)}100%{transform:scale(1.22)}}
@keyframes zout{0%{transform:scale(1.22)}38.3%{transform:scale(1.02)}100%{transform:scale(1.02)}}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 45%,#1b3a8c40,#0b1a45a6 70%,#050c26e6),repeating-conic-gradient(from 0deg at 50% 46%,#f9c6130d 0 5deg,transparent 5deg 15deg)}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
main{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:9vh 2vw 18vh}

/* القوس: العنصر المميز في الصفحة */
.arch{container-type:inline-size;position:relative;width:min(94vw,calc((100vh - 34vh) * .86),900px);aspect-ratio:600/700}
.arch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arch .fill{fill:#0a173f;fill-opacity:.82}
.arch .l1{fill:none;stroke:url(#g);stroke-width:7;stroke-linejoin:round}
.arch .l2{fill:none;stroke:var(--gold);stroke-opacity:.55;stroke-width:1.5}
.arch .glow{fill:none;stroke:var(--gold);stroke-width:14;stroke-opacity:.18;filter:blur(8px)}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14cqw 9cqw 6cqw}
.cong{font-family:'Reem Kufi',Cairo,sans-serif;font-size:5.4cqw;color:var(--gold2);letter-spacing:.4cqw;margin:0}
.rule{display:flex;align-items:center;gap:2cqw;width:62%;margin:1.2cqw 0 .6cqw}
.rule:before,.rule:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule:after{transform:scaleX(-1)}
.rule i{width:1.8cqw;height:1.8cqw;background:var(--gold);transform:rotate(45deg)}
.nmw{width:100%;min-height:15cqw;display:grid;place-items:center}
.nm{font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:13cqw;line-height:1.3;white-space:nowrap;margin:0;
 background:linear-gradient(100deg,#fff 20%,var(--gold) 40%,#fff 60%,var(--gold) 80%);background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;filter:drop-shadow(0 .6cqw 3cqw #f9c61377)}
.nm.wrap{white-space:normal;text-wrap:balance}
@keyframes sh{to{background-position:-300% 0}}
.pz{margin-top:2.4cqw;padding:1.1cqw 6cqw;border-radius:99px;font-weight:900;font-size:5.4cqw;color:#14264f;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 0 0 .7cqw #f9c61333,0 1.6cqw 5cqw #f9c61355}
.pz.t1{background:linear-gradient(135deg,#8db4ff,#d4e3ff)}
.pz.t3{background:linear-gradient(135deg,#ffcf70,#ffe7ae)}
.wait .cong{text-wrap:balance;font-size:5.6cqw;line-height:1.4;margin-top:.6cqw;padding:0 2cqw}
.wait p{margin:2cqw 0 0;color:#b9c8f0;font-size:3.4cqw}

/* ===== شاشة الترحيب (بديل شاشة الانتظار) ===== */
#hero{display:none}
body[data-mode=pre]:has([data-s=idle]:not([data-w="1"])) #hero{display:flex;position:fixed;inset:0;z-index:2;pointer-events:none;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;padding:5vh 4vw 24vh}
body[data-mode=pre]:has([data-s=idle]:not([data-w="1"])) main,body[data-mode=pre]:has([data-s=idle]:not([data-w="1"])) .brand{visibility:hidden}
#hero .hr{position:absolute;left:50%;top:46%;width:min(88vh,72vw);aspect-ratio:1;translate:-50% -50%;z-index:-1;opacity:.55}
#hero .hr svg{width:100%;height:100%;overflow:visible}
#hero .hr g{transform-box:fill-box;transform-origin:center}
#hero .hr .a{animation:spin 60s linear infinite}#hero .hr .b{animation:spinr 40s linear infinite}
.hrow{display:flex;align-items:center;gap:1.6vw}
.live{display:inline-flex;align-items:center;gap:.8vw;padding:.7vh 1.6vw;border-radius:99px;background:#d90f2f;color:#fff;font-weight:900;font-size:clamp(14px,1.7vw,34px);letter-spacing:.06em;box-shadow:0 0 3vh #d90f2f88}
.live i{width:1vw;height:1vw;min-width:9px;min-height:9px;border-radius:50%;background:#fff;animation:lv 1s ease-in-out infinite}
@keyframes lv{50%{opacity:.2;transform:scale(.7)}}
.hk{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--gold2);font-size:clamp(16px,2.2vw,44px);letter-spacing:.2vw}
.hl{display:flex;align-items:center;gap:2.4vw;padding:1.4vh 3vw;background:#fffffff2;border-radius:2.4vh;border:.35vh solid var(--gold);box-shadow:0 0 5vh #f9c61366;animation:hp 3.2s ease-in-out infinite}
.hl img{height:9vh;width:auto;display:block;object-fit:contain}
.hl img.t{height:8.2vh}
.hl b{width:.25vw;min-width:2px;height:8vh;background:linear-gradient(#0000,#c9a227,#0000)}
@keyframes hp{50%{transform:scale(1.03);box-shadow:0 0 8vh #f9c613aa}}
.ht{font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:clamp(28px,5.3vw,110px);line-height:1.22;margin:0;filter:drop-shadow(0 .8vh 3vh #f9c61355)}
.ht .l{display:block}
.ht span{display:inline-block;margin:0 .14em;background:linear-gradient(100deg,#fff 20%,var(--gold) 40%,#fff 60%,var(--gold) 80%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:wr .9s cubic-bezier(.2,1.3,.4,1) calc(var(--i)*.22s) both,sh 4s linear infinite}
@keyframes wr{from{opacity:0;transform:translateY(5vh) scale(.6);filter:blur(1.2vh)}to{opacity:1;transform:none;filter:none}}
#hero .rule{width:30vw;margin:0 auto}
.chips{display:flex;gap:1.6vw}
.chips span{padding:.8vh 2.2vw;border-radius:99px;font-weight:900;font-size:clamp(14px,1.9vw,38px);border:.3vh solid var(--gold);color:var(--gold2);background:#0a173fb3;animation:chip 6s ease-in-out infinite}
.chips span:nth-child(2){animation-delay:2s}.chips span:nth-child(3){animation-delay:4s}
@keyframes chip{0%,30%{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#14264f;transform:scale(1.1);box-shadow:0 0 3.5vh #f9c613aa}36%,100%{background:#0a173fb3;color:var(--gold2);transform:none;box-shadow:none}}
.hm{min-height:2.6em;max-width:70vw;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,1.9vw,38px);line-height:1.6;font-weight:700;color:#fff;padding:.8vh 5vw;text-shadow:0 .3vh 1.2vh #000;
 background:linear-gradient(90deg,#0a173f00,#0a173fd9 14%,#0a173fd9 86%,#0a173f00);text-wrap:balance}
.hm.mi{animation:mi .9s ease-out both}

body.txt #hero,body.txt .rays,body.txt #em{display:none!important}
/* ===== شاشة الانتظار الحماسية ===== */
.rays,#em,.bulb,.comet{display:none}
body:has([data-s=idle]) .rays{display:block;position:fixed;inset:-60%;z-index:1;pointer-events:none;
 background:repeating-conic-gradient(from 0deg at 50% 50%,#f9c61333 0 5deg,transparent 5deg 15deg);
 -webkit-mask:radial-gradient(circle at 50% 50%,#000 0,#0000 42%);mask:radial-gradient(circle at 50% 50%,#000 0,#0000 42%);
 animation:spin 50s linear infinite}
body:has([data-s=idle]) #em{display:block;position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#em i{position:absolute;bottom:-4vh;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#fff,var(--gold) 55%,#f9c61300 72%);
 opacity:0;animation:rise2 var(--d) var(--dl) linear infinite}
@keyframes rise2{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.95}100%{transform:translate(var(--x),-112vh) scale(1.1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
[data-s=idle] .bulb,[data-s=idle] .comet{display:inline;fill:none;stroke-linecap:round}
.bulb{stroke:var(--gold2);stroke-width:9;stroke-dasharray:.01 2.5}
.bulb.b2{stroke-dashoffset:-1.25;animation:blink .9s steps(1) infinite}
.bulb.b1{animation:blink .9s .45s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
.comet{stroke:#fff;stroke-width:13;stroke-dasharray:7 93;filter:drop-shadow(0 0 10px #ffe98a) drop-shadow(0 0 22px #f9c613);animation:run 3.2s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
[data-w="1"] .comet{animation-duration:1.4s}
[data-w="1"] .bulb{animation-duration:.45s!important}
.orb{position:relative;width:27cqw;height:27cqw;margin:0 auto 1.4cqw;filter:drop-shadow(0 0 2.4cqw #f9c61388);animation:orbp 1.8s ease-in-out infinite}
.orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb g{transform-box:fill-box;transform-origin:center}
.orb .o1{animation:spin 14s linear infinite}
.orb .o2{animation:spinr 9s linear infinite}
.orb .o3{animation:spin 5s linear infinite}
[data-w="1"] .orb .o1{animation-duration:4s}[data-w="1"] .orb .o2{animation-duration:2.6s}[data-w="1"] .orb .o3{animation-duration:1.4s}
.orb .q{position:absolute;inset:0;display:grid;place-items:center;font-family:'Reem Kufi',Cairo,sans-serif;font-size:19cqw;line-height:1;
 background:linear-gradient(100deg,#fff 20%,var(--gold) 45%,#fff 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite,qb 1.2s ease-in-out infinite}
@keyframes qb{50%{transform:scale(1.14) rotate(-4deg)}}
@keyframes orbp{50%{transform:scale(1.05)}}
.wait .cong{background:linear-gradient(100deg,#fff 20%,var(--gold) 40%,#fff 60%,var(--gold) 80%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:sh 3s linear infinite,tp 1.6s ease-in-out infinite;filter:drop-shadow(0 .4cqw 2cqw #f9c61366)}
@keyframes tp{50%{transform:scale(1.05)}}
.tk{height:7.4cqw;overflow:hidden;border-radius:99px;margin-top:2.4cqw;padding:0 7cqw;background:linear-gradient(135deg,var(--gold),var(--gold2));
 box-shadow:0 0 0 .6cqw #f9c61333,0 1.4cqw 4cqw #f9c61355;color:#14264f;font-weight:900;font-size:4.4cqw;min-width:44cqw}
.tkin{animation:tk 7.5s cubic-bezier(.7,0,.3,1) infinite}
.tkin span{display:block;height:7.4cqw;line-height:7.4cqw;white-space:nowrap}
@keyframes tk{0%,26%{transform:translateY(0)}33%,59%{transform:translateY(-7.4cqw)}66%,92%{transform:translateY(-14.8cqw)}100%{transform:translateY(-22.2cqw)}}
[data-w="1"] .tkin{animation-duration:3.6s}
.wait p#wd{min-height:16cqw;display:flex;align-items:center;justify-content:center;line-height:1.75;font-size:3.5cqw;color:#dbe5ff;padding:0 3cqw;text-wrap:balance}
.wait p#wd.mi{animation:mi .9s ease-out both}
@keyframes mi{from{opacity:0;transform:translateY(2.4cqw)}to{opacity:1;transform:none}}

/* الحالات */
[data-s=idle] .win{display:none}
[data-s=idle] .l1,[data-s=idle] .l2{animation:draw 2.4s ease-out both}
.wait{display:none;flex-direction:column;align-items:center}
[data-s=idle] .wait{display:flex}
[data-s=idle] .in>.win{display:none}
[data-s=go] .l1{animation:draw 1.8s cubic-bezier(.5,0,.2,1) both}
[data-s=go] .l2{animation:draw 2.2s .3s ease-out both}
[data-s=go] .fill{animation:fi 1s .4s both}
[data-s=go] .cong{animation:fi .8s 1.2s both}
[data-s=go] .rule{animation:fi .8s 1.4s both}
[data-s=go] .nm{animation:sh 4s linear infinite,pop 1.1s 1.6s cubic-bezier(.2,1.5,.4,1) both}
[data-s=go] .pz{animation:rise .9s 2.5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.l1,.l2,.glow{stroke-dasharray:1;stroke-dashoffset:0}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{transform:scale(.4);opacity:0;filter:blur(1.4cqw)}}
@keyframes rise{from{transform:translateY(4cqw);opacity:0}}


/* فقرات الحفل (نص / ختام) */
#seg{position:fixed;inset:0;z-index:3;display:none;place-items:center;padding:14vh 5vw 14vh}
body.txt #seg{display:grid}
body.txt main,body.txt #prev{visibility:hidden}
.sg{max-width:min(92vw,1100px);max-height:100%;overflow:hidden;text-align:center;border:3px solid var(--gold);border-radius:44px;background:#0a173fd6;padding:5vh 5vw;box-shadow:0 0 0 8px #f9c61322,0 20px 80px #000a;animation:sgin 1.1s cubic-bezier(.2,1,.3,1) both}
.sg h2{font-family:'Reem Kufi',Cairo,sans-serif;font-weight:700;font-size:clamp(32px,min(6.5vw,11vh),96px);line-height:1.35;margin:0;
 background:linear-gradient(100deg,#fff 20%,var(--gold) 40%,#fff 60%,var(--gold) 80%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;filter:drop-shadow(0 .6vw 2vw #f9c61366)}
.sg .rl{display:flex;align-items:center;gap:1.4vw;width:50%;margin:2.4vh auto 0}
.sg .rl:before,.sg .rl:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.sg .rl:after{transform:scaleX(-1)}
.sg .rl i{width:1.2vw;height:1.2vw;min-width:9px;min-height:9px;background:var(--gold);transform:rotate(45deg)}
.sg p{margin:3vh 0 0;font-weight:700;font-size:clamp(18px,min(3.3vw,5.4vh),50px);line-height:1.9;color:#fff3c4;white-space:pre-line}
body.end .sg p{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--gold2)}
.sg img{display:none}
body.pic #seg{padding:13vh 3vw 6vh}
body.pic .sg{max-width:min(94vw,1300px);padding:3vh 3vw}
body.pic .sg h2{font-size:clamp(26px,min(4.6vw,7.5vh),70px)}
body.pic .sg img{display:block;margin:2.4vh auto 0;max-width:100%;max-height:56vh;object-fit:contain;border-radius:26px;border:3px solid var(--gold);box-shadow:0 10px 50px #000a}
body.pic .sg p{font-size:clamp(16px,min(2.6vw,4.2vh),38px);margin-top:2vh}
.sgn{display:none}
body.pic .sgn{display:flex;flex-wrap:wrap;justify-content:center;gap:.9vh 1vw;margin-top:2vh;font-size:var(--nf,2.6vh)}
body.pic .sgn:empty{display:none}
body.pic.hasn .sg img{max-height:42vh}
.sgn span{background:#f9c61322;border:1.5px solid #f9c61399;border-radius:99px;padding:.25em .9em;color:#fff;font-weight:700;white-space:nowrap;animation:fi .8s both}
.sgn small{color:var(--gold2);font-weight:600;margin-inline-start:.55em;font-size:.7em}
.vf{display:none}
body.vid .vf{display:block;width:min(90vw,calc(62vh*16/9));aspect-ratio:16/9;margin:2.4vh auto 0;border:3px solid var(--gold);border-radius:22px;overflow:hidden;background:#000;box-shadow:0 10px 50px #000a}
.vf iframe,.vf video{width:100%;height:100%;border:0;display:block;background:#000}
body.vid #seg{padding:13vh 3vw 6vh}
body.vid .sg{max-width:min(94vw,1300px);padding:3vh 3vw}
body.vid .sg h2{font-size:clamp(26px,min(4.6vw,7.5vh),70px)}
/* فيديو بملء الشاشة */
body.vid #seg{z-index:20;padding:0;background:#000;display:block}
body.vid .sg{max-width:none;width:100%;height:100%;max-height:none;padding:0;border:0;border-radius:0;background:#000;box-shadow:none;animation:none;overflow:hidden}
body.vid .sg h2,body.vid .sg .rl,body.vid .sg p,body.vid .sg #sgi,body.vid .sgn,body.vid .gl{display:none!important}
body.vid .vf{width:100vw;height:100vh;aspect-ratio:auto;margin:0;border:0;border-radius:0;box-shadow:none}
body.vid .vf video,body.vid .vf iframe{width:100%;height:100%;object-fit:contain}
body.vid .vf iframe{pointer-events:none}
body.vid .vf iframe.crop{pointer-events:auto;height:calc(100% + 80px)}
body.vid .vf video::-webkit-media-controls{display:none!important}
body.vid .brand,body.vid .trip,body.vid .prev{display:none}
body.vid .fs{display:none}
body.vid,body.vid *{cursor:none!important}

body.vid .sg p{font-size:clamp(16px,min(2.6vw,4.2vh),38px);margin-top:2vh}
.gl{display:none}
body.gal .gl{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:1.6vh 1.2vw;height:54vh;margin-top:2.4vh;font-size:var(--nf,2.6vh)}
body.gal #seg{padding:13vh 3vw 5vh}
body.gal .sg{width:min(96vw,1500px);max-width:none;padding:3vh 2.5vw}
body.gal .sg h2{font-size:clamp(26px,min(4.6vw,7.5vh),70px)}
body.gal .sg p{font-size:clamp(16px,min(2.4vw,3.8vh),34px);margin-top:1.4vh}
.gc{display:flex;flex-direction:column;align-items:center;gap:.5vh;min-width:0;flex:none;width:var(--cw,200px);animation:fi .8s both}
.gp{flex:none;height:var(--ph,250px);width:100%;border-radius:18px;border:3px solid var(--gold);overflow:hidden;background:#ffffff14;display:grid;place-items:center;font-size:2.2em;box-shadow:0 6px 24px #0009}
.gp img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.gc b{max-width:100%;color:#fff;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc small{font-size:.68em;color:var(--gold2);font-weight:600}
@keyframes sgin{from{opacity:0;transform:scale(.9) translateY(4vh);filter:blur(10px)}}

/* اللوجوهات: أعلى اليمين */
.brand{position:fixed;z-index:4;top:2.4vh;right:2vw;display:flex;align-items:center;gap:clamp(8px,1.2vw,18px);background:#fff;border-radius:clamp(12px,1.4vw,22px);padding:clamp(6px,.9vh,12px) clamp(10px,1.4vw,22px);box-shadow:0 6px 24px #0006,0 0 0 3px #f9c61366;animation:fi 1s .2s both}
.brand img{height:clamp(38px,7.5vh,84px);display:block}
.brand img.c{height:clamp(46px,9.8vh,110px)}
.brand img.t{height:clamp(44px,8.8vh,100px)}
.brand .sep{width:2px;align-self:stretch;background:#d5ddf0;border-radius:2px}


/* أشكال زخرفية */
.deco{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.med{position:absolute;top:50%;width:min(19vw,34vh);aspect-ratio:1;margin-top:calc(min(19vw,34vh) / -2);opacity:.6;filter:drop-shadow(0 0 14px #f9c61366)}
.med.r{right:3vw}.med.l{left:3vw}
.med svg{width:100%;height:100%;overflow:visible}
.med .o,.med .n{transform-box:fill-box;transform-origin:center}
.med .o{animation:spin 70s linear infinite}
.med .n{animation:spin 45s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sp{position:absolute;width:var(--s);height:var(--s);background:linear-gradient(135deg,#fff,var(--gold));clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:tw 4.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
.fin{position:absolute;left:50%;top:-10cqw;width:17cqw;transform:translateX(-50%);filter:drop-shadow(0 0 2cqw #f9c61399);animation:fi 1s .6s both}
