<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الأدمن – همسة</title>
<style>
body{margin:0;background:#f4f7fc;color:#14264f;font-family:Tahoma,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:4px solid #f9c613}
header img{height:52px}h1{font-size:1.1rem;margin:0}
main{max-width:680px;margin:16px auto;padding:0 14px}
.card{background:#fff;border:1px solid #dbe3f2;border-radius:14px;padding:14px;margin-top:14px}
h2{margin:0 0 10px;font-size:1rem}
input,select,button,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #dbe3f2}
textarea{width:100%;box-sizing:border-box;margin-top:8px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>input{flex:1;min-width:150px}
button{cursor:pointer;background:#24408e;color:#fff;border:0;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:#f9c613;color:#14264f}button.x{background:#e11d48;padding:4px 10px}
button.sm{padding:5px 10px}button.big{width:100%;font-size:1.15rem;padding:14px}
.w{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed #dbe3f2}.w .x{margin-inline-start:auto}
.seg{flex-wrap:wrap;border-radius:8px;padding:8px}.seg.on{background:#fff4c2;border-bottom-color:#f9c613}
.seg>span:first-child{flex:1;min-width:160px;font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap}.seg .x{margin-inline-start:0}
.nav{display:flex;gap:8px;margin-bottom:10px}.nav button{flex:1}
.hint{color:#4a5b86;font-size:.9rem;margin-bottom:8px}
#msg{margin-top:8px;font-weight:700}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><h1>لوحة الأدمن</h1></header>
<main>
<div class="card" id="login"><h2>🔐 كلمة السر</h2>
<div class="row"><input id="pw" type="password" placeholder="كلمة سر الأدمن"><button id="lb">دخول</button></div></div>

<div id="panel" style="display:none">

<div class="card"><h2>🎬 فقرات الحفل (اللي بتظهر على صفحة الفائز)</h2>
<div class="nav"><button id="pv">⏮ السابقة</button><button class="g" id="nxs">الفقرة التالية ⏭</button><button class="x" id="stp" style="padding:10px 12px">⏹ شاشة الانتظار</button></div>
<div id="segs"></div>
<h2 style="margin-top:16px" id="fh">➕ إضافة فقرة</h2>
<div class="row"><select id="st"><option value="text">📝 نص (عنوان + نص)</option><option value="draw">🎰 قرعة (شاشة الفائزين)</option><option value="photo">📸 صورة (جماعية مع مجلس الإدارة)</option><option value="video">🎬 فيديو</option><option value="gallery">🖼️ صور الفائزين (صور + أسماء)</option><option value="end">🏁 ختام (جملة + قصاصات)</option></select><input id="sti" placeholder="عنوان الفقرة (مثال: كلمة رئيس مجلس الإدارة)"></div>
<div id="sib" style="display:none"><input id="si" dir="ltr" placeholder="اسم ملف الصورة (مثال: group.jpg) أو رابط صورة / رابط Google Drive" style="width:100%;box-sizing:border-box;margin-top:8px"><div class="hint" id="sih" style="margin-top:6px"></div></div>
<textarea id="stx" rows="3" placeholder="نص يظهر تحت العنوان (اختياري) — آية، جملة الختام، اسم المتحدث..."></textarea>
<div class="row" style="margin-top:8px"><button class="g" id="sb">إضافة الفقرة</button><button id="sc" style="display:none;background:#8a96b8">إلغاء التعديل</button></div></div>

<div class="card"><h2>🎊 إعلان فائز</h2>
<div class="row"><input id="an" placeholder="اسم الفائز"><input id="aph" dir="ltr" placeholder="صورة الفائز (اسم ملف أو رابط) – اختياري"><select id="ap"><option>عمرة تيسير</option><option>عمرة مجانية</option><option>عمرة نص مجانية</option></select><button class="g" id="ab">إظهار الفائز</button></div></div>
<div class="card"><h2>⏭️ الفائز التالي</h2>
<div class="hint">بيعرض على الشاشة رسالة "يا ترى مين الفائز الجاي؟" لحد ما تضيف الفائز اللي بعده (في فقرة القرعة).</div>
<button class="g big" id="nx">❓ يا ترى مين الفائز الجاي؟</button><div id="ws" style="margin-top:8px;font-weight:700"></div></div>
<div class="card"><h2>📺 رابط البث</h2>
<div class="row"><input id="au" dir="ltr" placeholder="رابط يوتيوب أو فيسبوك"><button id="as">حفظ</button></div></div>
<div class="card"><h2>🏆 الفائزون</h2><div id="list"></div><button class="x" id="clr" style="margin-top:10px">مسح الكل</button></div>
</div>
<div id="msg"></div>
</main>
<script src="config.js"></script>
<script>
const $=i=>document.getElementById(i);
let PW=sessionStorage.getItem('pw')||'';
let SEG=[],CUR=0,EDIT=0;
const TYPES={text:'📝 نص',draw:'🎰 قرعة',photo:'📸 صورة',video:'🎬 فيديو',gallery:'🖼️ صور الفائزين',end:'🏁 ختام'};
const HINTS={gallery:['','بتعرض كل الفائزين بصورهم وأسمائهم. الصورة بتتحط لكل فائز من قايمة "🏆 الفائزون" تحت (زرار 📷) أو وقت إضافة الفائز. اللي من غير صورة بيظهر باسمه بس. النص اللي تحت بيظهر كتعليق.'],photo:['اسم ملف الصورة (مثال: group.jpg) أو رابط صورة / رابط Google Drive','ارفع الصورة جنب ملفات الموقع واكتب اسمها هنا، أو حط رابط من Google Drive (المشاركة: أي شخص معاه الرابط). النص اللي تحت بيظهر كتعليق.'],video:['رابط يوتيوب / فيسبوك / Google Drive، أو اسم ملف فيديو (مثال: clip.mp4)','يوتيوب وفيسبوك: الصق رابط الفيديو. Google Drive: المشاركة لأي شخص معاه الرابط. ملف مرفوع جنب الموقع: اكتب اسمه (mp4 أفضل). النص اللي تحت بيظهر كتعليق.']};
function msg(t,ok){$('msg').textContent=t;$('msg').style.color=ok?'#15803d':'#e11d48';}
async function call(body){
 try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({password:PW},body))});
 const t=await r.text();
 try{return JSON.parse(t)}catch(e){return {ok:false,error:'الرد مش JSON – غالبًا النشر مش Anyone أو محتاج نسخة جديدة: '+t.slice(0,80)}}
 }catch(e){return {ok:false,error:'تعذر الاتصال: '+e.message}}
}
async function act(body,okMsg){const r=await call(body);
 if(r.ok)msg(okMsg||'تم ✅',true);else msg(r.error==='unknown_action'?'فشل: unknown_action – انشر نسخة جديدة من Code.gs (Deploy > Manage deployments > New version)':'فشل: '+r.error);
 refresh();return r}

function btn(txt,cls,fn,dis){const x=document.createElement('button');x.className=cls;x.textContent=txt;x.disabled=!!dis;x.onclick=fn;return x}
function drawSegs(){
 const b=$('segs');b.textContent='';
 if(!SEG.length){b.textContent='مفيش فقرات – ضيف أول فقرة من تحت';return}
 SEG.forEach((g,i)=>{
  const r=document.createElement('div');r.className='w seg'+(g.id===CUR?' on':'');
  const t=document.createElement('span');t.textContent=(g.id===CUR?'🔴 ':'')+(i+1)+'. '+g.title+'  ('+TYPES[g.type]+')';
  const box=document.createElement('span');box.className='acts';
  box.append(
   btn('▶ اعرض','sm g',()=>act({action:'setCurrent',id:g.id},'الفقرة بتظهر دلوقتي ✅'),g.id===CUR),
   btn('↑','sm',()=>act({action:'moveSegment',id:g.id,dir:-1}),i===0),
   btn('↓','sm',()=>act({action:'moveSegment',id:g.id,dir:1}),i===SEG.length-1),
   btn('✏️','sm',()=>editSeg(g)),
   btn('حذف','sm x',()=>{if(confirm('حذف الفقرة "'+g.title+'"؟'))act({action:'deleteSegment',id:g.id})}));
  r.append(t,box);b.append(r)});
}
function step(d){
 const i=SEG.findIndex(g=>g.id===CUR);let n=i<0?(d>0?0:-1):i+d;
 if(n<0||n>=SEG.length){msg('مفيش فقرة '+(d>0?'بعد':'قبل')+' كده');return}
 act({action:'setCurrent',id:SEG[n].id},'الفقرة بتظهر دلوقتي ✅')}
function togImg(){const t=$('st').value,h=HINTS[t];$('sib').style.display=h?'':'none';if(h){$('si').style.display=t==='gallery'?'none':'';$('si').placeholder=h[0];$('sih').textContent=h[1]}}
function resetForm(){EDIT=0;$('si').value='';$('sti').value='';$('stx').value='';$('st').value='text';$('sb').textContent='إضافة الفقرة';$('fh').textContent='➕ إضافة فقرة';$('sc').style.display='none';togImg()}
function editSeg(g){EDIT=g.id;$('st').value=g.type;$('si').value=g.img||'';togImg();$('sti').value=g.title;$('stx').value=g.text||'';
 $('sb').textContent='حفظ التعديل';$('fh').textContent='✏️ تعديل فقرة';$('sc').style.display='';$('sti').scrollIntoView({behavior:'smooth',block:'center'})}

function drawWinners(ws){
 const l=$('list');l.textContent='';
 ws.forEach(w=>{const r=document.createElement('div');r.className='w';
  const t=document.createElement('span');t.textContent='🏅 '+w.name+' – '+w.prize+(w.photo?'  ✅ صورة':'');t.style.flex='1';r.append(t);
  const ph=document.createElement('button');ph.className='sm';ph.textContent='📷';ph.title='صورة الفائز';
  ph.onclick=async()=>{const v=prompt('صورة '+w.name+' (اسم ملف مرفوع جنب الموقع، أو رابط صورة / Google Drive). سيبها فاضية للمسح:',w.photo||'');if(v===null)return;await act({action:'setWinnerPhoto',id:w.id,photo:v},'تم حفظ الصورة ✅')};
  r.append(ph);
  const x=document.createElement('button');x.className='x';x.textContent='حذف';
  x.onclick=async()=>{await call({action:'deleteWinner',id:w.id});refresh()};
  r.append(x);l.append(r)});
}
async function refresh(){
 const s=await call({action:'list'});
 if(!s.ok){msg('فشل: '+(s.error==='unknown_action'?'unknown_action – انشر نسخة جديدة من Code.gs':s.error));return}
 SEG=s.segments||[];CUR=s.current||0;drawSegs();
 if(document.activeElement!==$('au'))$('au').value=s.stream||'';
 $('ws').textContent=s.waiting?'⏳ الشاشة دلوقتي بتعرض: يا ترى مين الفائز الجاي؟':'';
 drawWinners(s.winners||[]);
}
async function enter(){
 try{const r=await call({action:'check'});
  if(r.ok){sessionStorage.setItem('pw',PW);$('login').style.display='none';$('panel').style.display='block';msg('');refresh()}
  else msg(r.error==='unauthorized'?'كلمة السر غلط':'فشل: '+r.error);
 }catch(e){msg('تعذر الاتصال بالسيرفر – راجع API_URL في config.js')}
}
$('lb').onclick=()=>{PW=$('pw').value;enter()};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lb').click()});

$('pv').onclick=()=>step(-1);
$('nxs').onclick=()=>step(1);
$('stp').onclick=()=>act({action:'setCurrent',id:0},'الشاشة على وضع الانتظار ✅');
$('sc').onclick=resetForm;
$('st').onchange=togImg;
$('sb').onclick=async()=>{
 const title=$('sti').value.trim();if(!title){msg('اكتب عنوان الفقرة');return}
 const body={action:EDIT?'updateSegment':'addSegment',id:EDIT,type:$('st').value,title:title,text:$('stx').value,img:$('si').value};
 const r=await act(body,EDIT?'تم حفظ التعديل ✅':'تمت إضافة الفقرة ✅');
 if(r.ok)resetForm();
};

$('ab').onclick=async()=>{
 const n=$('an').value.trim();if(!n)return;
 const r=await call({action:'addWinner',name:n,prize:$('ap').value,photo:$('aph').value});
 if(r.ok){$('an').value='';$('aph').value='';msg('تم إظهار الفائز ✅',true);refresh()}else msg('فشل: '+r.error);
};
$('nx').onclick=async()=>{const r=await call({action:'nextWinner'});
 if(r.ok){msg('الشاشة بتعرض رسالة الفائز الجاي ✅',true);refresh()}else msg('فشل: '+r.error);
};
$('an').addEventListener('keydown',e=>{if(e.key==='Enter')$('ab').click()});
$('as').onclick=async()=>{const r=await call({action:'setStream',url:$('au').value});msg(r.ok?'تم حفظ البث ✅':'فشل: '+r.error,r.ok)};
$('clr').onclick=async()=>{if(confirm('مسح كل الفائزين؟')){await call({action:'clearWinners'});refresh()}};
if(PW)enter();
</script>
</body>
</html>
